# Minimal allowlisting forward proxy for the sandbox's outbound HTTP(S).
# Default-deny: only the domains listed below are reachable. Everything
# else gets a 403, not a silent hang or a routing failure, so a blocked
# request is obvious in the agent's own output.
#
# Add domains here as legitimate build/registry needs come up (e.g. your
# org's own Artifactory/Nexus mirror instead of public Maven Central/npm).
# Wildcards use a leading dot: ".example.com" matches example.com and any
# subdomain.

acl allowed_domains dstdomain .repo.maven.apache.org
acl allowed_domains dstdomain .repo1.maven.org
acl allowed_domains dstdomain .registry.npmjs.org

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

http_port 3128
coredump_dir /var/spool/squid
access_log daemon:/var/log/squid/access.log
cache deny all
